name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/gmail-account-generator-sbf9uw
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # Needs Settings -> Pages -> Source: "GitHub Actions" set once by a repo
      # admin. The workflow token cannot create the Pages site itself
      # ("Resource not accessible by integration"), so enablement: true does
      # not help here.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
